name: Check site build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-check
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build for GitHub Pages
        env:
          VITE_NOTIFY_URL: ${{ secrets.VITE_NOTIFY_URL }}
          VITE_NOTIFY_SECRET: ${{ secrets.VITE_NOTIFY_SECRET }}
        run: npm run build:gh
