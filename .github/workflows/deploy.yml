name: Check site and cabinet security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix server
      - name: Check private cabinet and consent
        run: npm run test:security
      - name: Guard VITE_API_URL (152-FZ)
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: node scripts/check-api-url.mjs
      - name: Build for Timeweb
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build
